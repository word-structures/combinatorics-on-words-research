<p>The Interactive Explorer has moved.</p>
<p><a href="explorer.html">Full Interactive Explorer</a></p>

<script>
(function () {
  'use strict';
  // Compatibility bridge only. The 20 slugs below are the exact legacy hash
  // routes verified against explorer.html's MODE_TO_SLUG router. Unknown
  // hashes are deliberately left unforwarded rather than guessed at, so this
  // file never creates an undocumented routing contract.
  var KNOWN_LEGACY_SLUGS = [
    'tutorial', 'tree-search', 'abc-lab', 'morphism-g85', '2d-walk',
    'sonification', 'try-it', 'timeline', 'unfavorable-factors',
    'morphism-microscope', 'concept-graph', 'morphism-lab', 'heat-map',
    'abelisk', 'aa2fr-extension', 'applications', 'validation', 'gallery',
    'seam-search', 'graveyard'
  ];

  var rawHash = location.hash.replace(/^#/, '');
  if (!rawHash) {
    location.replace('explorer.html');
    return;
  }

  var slug = decodeURIComponent(rawHash);
  if (KNOWN_LEGACY_SLUGS.indexOf(slug) !== -1) {
    location.replace('explorer.html' + location.hash);
  }
  // Unknown hash: stay on this page: the static text and link above remain
  // visible instead of forwarding to an unverified destination.
})();
</script>
